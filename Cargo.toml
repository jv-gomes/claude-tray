[workspace]
resolver = "3"
members = ["crates/*"]

# ---------------------------------------------------------------------------
# Shared package metadata. Every crate inherits these with `field.workspace = true`
# so version, licence, and repository never drift between crates.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jv-gomes/claude-tray"
homepage = "https://github.com/jv-gomes/claude-tray"
authors = ["João Vitor"]
keywords = ["claude", "tray", "systray", "usage", "monitor"]
categories = ["command-line-utilities", "gui"]

# ---------------------------------------------------------------------------
# Shared dependency versions.
#
# Intentionally empty. Per the dependency policy in CONTRIBUTING.md, every
# dependency must be justified when it is introduced, so entries are added by
# the phase that first needs them rather than speculatively up front.
#
# When adding one: pin the version here, disable default features, and have
# member crates reference it with `foo.workspace = true`.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Time. The `clock` feature is deliberately absent: without it `Utc::now()` and
# `Local` do not exist, so core logic is forced to take the current instant as a
# parameter. That is what keeps `claude-tray-core` free of ambient I/O and makes
# time-dependent behaviour testable with fixed instants. The binary crate opts
# into `clock` separately for local-time display. See docs/adr/0006.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }

# Async traits. `UsageProvider` has to be object-safe — the registry and the
# fallback chain hold `dyn UsageProvider` — and native `async fn` in traits is
# not. This is the boxing that would otherwise be written by hand at every call.
async-trait = "0.1"

# Argument parsing for the binary. Default features off: the colour, suggestion,
# and wrap-help machinery pulls in a tree several times the size of what a tray
# app's handful of flags needs.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# Async runtime for the binary. Only the current-thread runtime and the macros;
# the tray event loop owns the main thread, so a multi-threaded scheduler would
# be paying for workers that have nothing to do. Revisit in phase 6.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

# Locating the user's home directory per-platform. Used only for that: Claude
# Code keeps its state in `~/.claude` on every OS rather than in the XDG or
# Known Folders locations, so the rest of the crate's API does not apply.
directories = "6"

# Reading Claude Code's local transcripts, which are JSON Lines.
serde_json = "1"

# 2D rasteriser for the tray icon. No SVG layer: the battery is a rounded
# rectangle, a nub, and a clipped fill, so `resvg` would add an XML parser and
# font shaping to draw two rectangles and no text. See docs/adr/0005.
tiny-skia = { version = "0.12", default-features = false, features = [
    "std",
    "simd",
    "png-format",
] }

# Internal crates.
claude-tray-core = { path = "crates/claude-tray-core", version = "0.0.0" }
claude-tray-icon = { path = "crates/claude-tray-icon", version = "0.0.0" }
claude-tray-provider = { path = "crates/claude-tray-provider", version = "0.0.0" }

# Dev-only.
png = "0.18"
proptest = "1"
tempfile = "3"

# ---------------------------------------------------------------------------
# Lints, applied workspace-wide via `[lints] workspace = true` in each crate.
#
# Lint *groups* carry `priority = -1` so that the specific lints below can
# override them; without it the ordering is unspecified.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# A tray app that panics disappears from the user's tray with no explanation.
# Library code returns Result instead. Tests opt out via a crate-level
# `cfg_attr(test, allow(...))` — see any lib.rs.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

# Every type is re-exported at the crate root, so module names never appear in the
# public API and this lint would only force awkward names — `Kind` instead of
# `WindowKind` — for no reader benefit.
module_name_repetitions = "allow"

# Correctness and clarity beyond pedantic.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stderr = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# NOTE: `panic = "abort"` means `cargo test --release` will not work, because
# libtest needs unwinding to catch `#[should_panic]`. Run tests on the default
# dev profile (`cargo test`), which is what CI does.
panic = "abort"

# Profile used for published release artifacts, optimised for size over speed.
# A tray app is idle almost all of the time, so binary size matters more than
# throughput. Compare against `release` before adopting it — see P1-22.
[profile.dist]
inherits = "release"
opt-level = "z"
