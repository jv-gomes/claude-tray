[package]
name = "claude-tray-provider"
description = "Usage data sources for Claude Tray, behind a common provider trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
claude-tray-core.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Providers are the I/O boundary, so this is where reading the clock belongs —
# hence `clock`, which `claude-tray-core` deliberately does without. See
# docs/adr/0006-chrono-for-time.md.
chrono = { workspace = true, features = ["clock"] }
directories.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[features]
default = ["mock"]

# Synthetic usage data. Enabled by default so the UI can be developed and tested
# without Claude credentials.
mock = []

[lints]
workspace = true
